<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35"/>

  <!-- Center Consular Crest / Shield -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Heraldic Crest Shield -->
    <path d="M 0,-140 C 90,-140 140,-100 140,-20 C 140,85 70,140 0,175 C -70,140 -140,85 -140,-20 C -140,-100 -90,-140 0,-140 Z" 
          fill="#090d16" stroke="url(#goldGrad)" stroke-width="14"/>
    
    <!-- Inner Accent Shield -->
    <path d="M 0,-115 C 70,-115 110,-85 110,-20 C 110,65 55,115 0,145 C -55,115 -110,65 -110,-20 C -110,-85 -70,-115 0,-115 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

    <!-- Stylized Monogram CP (ConsulPortal) with Global Latitude Lines -->
    <!-- Globe Ring Arc -->
    <ellipse cx="0" cy="-5" rx="80" ry="32" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.8" transform="rotate(-15)"/>
    
    <!-- Letter 'C' & 'P' integrated crest symbol -->
    <!-- Left 'C' Curve -->
    <path d="M 30,-65 C -45,-65 -75,-25 -75,0 C -75,25 -45,65 30,65" 
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Center Column / 'P' stem and loop -->
    <path d="M -15,-65 L -15,70" 
          fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M -15,-65 L 20,-65 C 50,-65 60,-45 60,-15 C 60,15 50,25 20,25 L -15,25" 
          fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Star Emblem on top -->
    <path d="M 0,-85 L 6,-70 L 22,-70 L 9,-60 L 14,-45 L 0,-55 L -14,-45 L -9,-60 L -22,-70 L -6,-70 Z" 
          fill="url(#goldGrad)"/>
  </g>
</svg>
